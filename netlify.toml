# Netlify build configuration.
#
# `prisma migrate deploy` runs before the build so a deploy that introduces a
# schema change applies it first. It is non-interactive and a no-op when there
# is nothing pending, so it is safe on every deploy.
#
# Note this uses DATABASE_URL. Neon's pooled connection works for migrations in
# most cases, but if a migration fails with an advisory-lock error, set a
# separate DIRECT_URL to the non-pooled host and use it here instead.

[build]
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Prisma's engine download is cached between builds; this keeps it predictable.
  PRISMA_CLI_BINARY_TARGETS = "native"

[[plugins]]
  package = "@netlify/plugin-nextjs"
